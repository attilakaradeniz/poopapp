<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Record</title>
</head>
<body>
	
<nav style="margin-bottom: 1rem;">
    <a href="/" style="margin-right: 1rem;">Home</a>
    <a href="/dashboard" style="margin-right: 1rem;">Dashboard</a>
    <a href="/form">New Entry</a>
</nav>
	
    <h1>Edit Record</h1>
    <form action="/update/{{ record[0] }}" method="post">
        <label for="date">Date (YYYY-MM-DD):</label>
        <input type="text" id="date" name="date" value="{{ record[1] }}" required><br><br>

        <label for="start_time">Start Time (HH:MM):</label>
        <input type="text" id="start_time" name="start_time" value="{{ record[2] }}" required><br><br>

        <label for="end_time">End Time (HH:MM):</label>
        <input type="text" id="end_time" name="end_time" value="{{ record[3] }}" required><br><br>

        <button type="submit">Update Record</button>
    </form>
    <br>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
