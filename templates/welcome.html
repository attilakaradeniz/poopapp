<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            text-align: center;
        }

        nav {
            margin-bottom: 2rem;
        }

        a {
            margin: 0 1rem;
            text-decoration: none;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2rem;
        }

        p {
            font-size: 1.1rem;
            color: #555;
        }

        .button-container {
            margin: 20px;
        }
        
        .timer-container {
            margin-top: 2rem;
        }

        #timer {
            font-size: 2rem;
        }
        #progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            height: 20px;
            margin-top: 10px;
        }
        #progress-bar span {
            display: block;
            height: 100%;
            background-color: #76c7c0;
            width: 0%;
            transition: width 1s;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/form">New Entry</a>
    </nav>

    <h1>Welcome to the pooptivity Tracker App</h1>
    <p>This simple app lets you record and view your daily pooptivity durations.</p>
    <p>Use the navigation above to add a new entry or view your dashboard.</p>
    
 <p style="font-size: 1.4rem;">
    <span style="font-size: 2rem;">💩</span>
    Let's record and view your <strong>daily pooptivity</strong>!
</p>

<div class="timer-controls">
    <div class="button-container">
        <button id="startBtn" onclick="startTimer()">START</button>
        <button id="endBtn" onclick="endTimer()" disabled>END</button>
    </div>

    <div class="timer-container">
        <p id="timer">00:00</p>
        <div id="progress-bar"><span></span></div>
    </div>
</div>

<script src="/static/js/timer.js"></script>
</body>
</html>
