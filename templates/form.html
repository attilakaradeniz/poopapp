<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poop Timer</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .button-container {
            margin: 20px;
        }
        .timer-container {
            margin-top: 30px;
        }
        #timer {
            font-size: 2rem;
        }
        #progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            height: 20px;
        }
        #progress-bar span {
            display: block;
            height: 100%;
            background-color: #76c7c0;
            width: 0%;
        }
    </style>
</head>
<body>

    <h1>Poop Timer</h1>
    <div class="button-container">
        <button id="startBtn" onclick="startTimer()">START</button>
        <button id="endBtn" onclick="endTimer()" disabled>END</button>
    </div>

    <div class="timer-container">
        <p id="timer">00:00</p>
        <div id="progress-bar"><span></span></div>
    </div>

<script src="../static/js/timer.js"></script>
</body>
</html>
