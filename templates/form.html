<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add New Record</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    nav {
      margin-bottom: 1rem;
      text-align: center;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #007bff;
    }

    label[for="raw_input"] {
      display: block;
      text-align: center;
      font-size: 1rem;
      color: #333;
      margin-top: 1.5rem;
      margin-bottom: 0.25rem;
    }

    input[type="tel"],
    button[type="submit"],
    #toggleBtn {
      width: 70%;
      max-width: 300px;
      font-size: 1.2rem;
      padding: 0.75rem 1rem;
      box-sizing: border-box;
      margin: 0.5rem auto;
      display: block;
      border-radius: 8px;
    }

    input[type="tel"] {
      border: 1px solid #ccc;
    }

    button[type="submit"] {
      background-color: #2ecc71;
      color: black;
      border: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button[type="submit"]:active {
      background-color: #3e8e41;
    }

    #toggleBtn {
      background-color: #2ecc71;
      color: black;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.3s ease;
    }

    #toggleBtn:active {
      background-color: #27ae60;
    }

    .info {
      margin-top: 1rem;
      color: gray;
      font-size: 0.95rem;
      text-align: center;
    }

    .timer-section {
      text-align: center;
      margin-top: 3rem;
    }

    #timer {
      font-size: 2rem;
      margin-top: 1rem;
    }

    #progress-bar {
      width: 100%;
      background-color: #e0e0e0;
      height: 20px;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
    }

    #progress-bar span {
      display: block;
      height: 100%;
      background-color: #76c7c0;
      width: 0%;
      transition: width 1s;
    }
  </style>
</head>

<body>
  <nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/form">New Entry</a>
  </nav>

  <h1 style="text-align: center;">Add New Record</h1>

  <form action="/submit" method="post">
    <label for="raw_input">Enter Pooptivity Code:</label>
    <input
      type="tel"
      name="raw_input"
      id="raw_input"
      pattern="[0-9]{16}"
      maxlength="16"
      required
      autofocus
      placeholder="e.g. 1107202510581108"
    />
    <button type="submit">Add pooptivity</button>
  </form>

  <div class="info">
    Format: <code>DDMMYYYYHHMMHHMM</code><br />
    Example: <code>1107202510581108</code>
  </div>

  <div class="timer-section">
    <h2>Or use Poop Timer</h2>
    <button id="toggleBtn">Start</button>
    <p id="timer">00:00</p>
    <div id="progress-bar"><span></span></div>
  </div>

  <script src="../static/js/timer.js"></script>
</body>

</html>
