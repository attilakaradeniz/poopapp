<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Record</title>
    <!-- <script src="{{ url_for('static', filename='js/timer.js') }}" defer></script> -->
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        nav {
            margin-bottom: 1rem;
            text-align: center;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #007BFF;
        }

        input[type="tel"] {
            width: 100%;
            font-size: 1.2rem;
            padding: 0.75rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        button {
            appearance: none;
            -webkit-appearance: none;
            display: block;
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        button:active {
            background-color: #3e8e41;
        }

        .info {
            margin-top: 1rem;
            color: gray;
            font-size: 0.95rem;
            text-align: center;
        }

        .timer-section {
            text-align: center;
            margin-top: 3rem;
        }

        #timer {
            font-size: 2rem;
            margin-top: 1rem;
        }

        #progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            height: 20px;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress-bar span {
            display: block;
            height: 100%;
            background-color: #76c7c0;
            width: 0%;
            transition: width 1s;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/form">New Entry</a>
</nav>

<h1>Add New Record</h1>

<form action="/submit" method="post">
    <label for="raw_input">Enter string:</label>
    <input type="tel" name="raw_input" id="raw_input"
           pattern="[0-9]{16}" maxlength="16"
           required autofocus placeholder="e.g. 1107202510581108">
    <button type="submit">Submit</button>
</form>

<div class="info">
    Format: <code>DDMMYYYYHHMMHHMM</code><br>
    Example: <code>1107202510581108</code>
</div>

<div class="timer-section">
    <h2>Or use Poop Timer</h2>
    <button id="startBtn">START</button>
    <button id="endBtn" disabled>END</button>

    <p id="timer">00:00</p>
    <div id="progress-bar"><span></span></div>
</div>
<script src="../static/js/timer.js"></script>
</body>
</html>
