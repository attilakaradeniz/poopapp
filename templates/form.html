<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Record</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        input[type="tel"] {
            width: 100%;
            font-size: 1.2rem;
            padding: 0.75rem;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        button {
			appearance: none;
			-webkit-appearance: none;
			display: block;
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
			border-sizing: border-box;
			transition: background-color 0.3s ease;
			cursor: pointer;
        }
        button:active {
            background-color: #3e8e41;
        }
        .info {
            margin-top: 1rem;
            color: gray;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
	
<nav style="margin-bottom: 1rem;">
    <a href="/" style="margin-right: 1rem;">Home</a>
    <a href="/dashboard" style="margin-right: 1rem;">Dashboard</a>
    <a href="/form">New Entry</a>
</nav>
	
    <h1> Add New Record</h1>
    <form action="/submit" method="post">
        <label for="raw_input">Enter string:</label>
        <input type="tel" name="raw_input" id="raw_input"
               pattern="[0-9]{16}" maxlength="16"
               required autofocus placeholder="e.g. 1107202510581108">
        <button type="submit">Submit</button>
    </form>
    <div class="info">
        Format: <code>DDMMYYYYHHMMHHMM</code><br>
        Example: <code>1107202510581108</code>
    </div>
</body>
</html>
