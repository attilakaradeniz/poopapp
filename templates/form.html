<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poop Timer</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .button-container {
            margin: 20px;
        }
        .timer-container {
            margin-top: 30px;
        }
        #timer {
            font-size: 2rem;
        }
        #progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            height: 20px;
        }
        #progress-bar span {
            display: block;
            height: 100%;
            background-color: #76c7c0;
            width: 0%;
        }
    </style>
</head>
<body>

    <h1>Poop Timer</h1>
    <div class="button-container">
        <button id="startBtn" onclick="startTimer()">START</button>
        <button id="endBtn" onclick="endTimer()" disabled>END</button>
    </div>

    <div class="timer-container">
        <p id="timer">00:00</p>
        <div id="progress-bar"><span></span></div>
    </div>

    <script>
        let timer;
        let seconds = 0;
        let isRunning = false;
        let progressBar = document.querySelector("#progress-bar span");

        function startTimer() {
            isRunning = true;
            document.getElementById("startBtn").disabled = true;
            document.getElementById("endBtn").disabled = false;

            timer = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;

                // Update timer display
                document.getElementById("timer").innerText = `${pad(mins)}:${pad(secs)}`;

                // Update progress bar
                let percentage = (seconds / 3600) * 100; // Assuming 1 hour as max for the demo
                progressBar.style.width = `${percentage}%`;

            }, 1000);
        }

        function endTimer() {
            isRunning = false;
            clearInterval(timer);

            // Call backend to save the time
            saveDuration(seconds);

            document.getElementById("startBtn").disabled = false;
            document.getElementById("endBtn").disabled = true;
        }

        function pad(value) {
            return value < 10 ? `0${value}` : value;
        }

        function saveDuration(duration) {
            fetch('/save-timer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ duration: duration })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Data saved", data);
            })
            .catch(error => {
                console.error("Error:", error);
            });
        }
    </script>

</body>
</html>
